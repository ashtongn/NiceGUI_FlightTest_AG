    isolation_typ_db: {points: [[900, 85.0], [1100, 85.0], [1300, 83.0], [1500, 80.0], [1700, 88.0], [1900, 83.0], [2000, 90.0], [2100, 79.0], [2300, 72.0], [2500, 68.0], [2700, 62.0]], unit: dB, source: "https://www.pasternack.com/images/ProductPDF/PE71S2041.pdf", note: "typical curve read approx +/-2 dB (information only)", verify: true}
    power_rating_dbm: {value: 50.0, unit: dBm, source: "https://www.pasternack.com/images/ProductPDF/PE71S2041.pdf", note: "100 W CW max input, below the 125 W typ Psat of the 1189 / 1211", verify: false}
