bench_fixture:
  # Characterization equipment used on the bench only: antenna removed, this
  # coupler and power meter inline for a per-frequency output-power reading,
  # then taken back out for a loopback.  No payload profile references these;
  # the measurement panel uses them to work out the expected meter reading.
  note: "Bench characterization fixture, removed before flight. Not part of any payload chain."
  coupler: coupler_zgdc30_372hp
  power_meter: power_meter_pwr_8p_rc

profiles:
  P1:
    label: "Payload 1 (1208 HPA, ZGDC30-372HP+ coupler, ZKL-33ULN-S+ LNA)"
    source: "Payload wiring 1189 v2 02Nov26.pdf, top drawing (Payload 1, 18Jun26)"
    g40_tx: g40_tx
    g40_rx: g40_rx
    hpa: hpa_1208
    switch: switch_pe71s2041
    antenna: antenna_omnilog_pro_nh
    lna: lna_zkl_33uln
    rx_atten: rcdat_6g_120h
    # band = overlap of the components' freq_range_mhz unless band_mhz is set here
    cables_db:
      g40_to_hpa: {value: 0.2, unit: dB, source: "estimate", note: "assumed one 12-in Mini-Circuits Hand-Flex .141 assembly (141-12SM+, 0.19 dB at 2 GHz typ); to be measured", verify: true}
      hpa_to_switch: {value: 0.3, unit: dB, source: "estimate", note: "HPA output through the ZGDC30-372HP+ coupler mainline (0.08-0.12 dB typ 1.5-2.5 GHz, datasheet) to the T/R switch; assumed one 12-in Hand-Flex .141 assembly plus 0.1 dB for the coupler; to be measured. The coupled port feeds the PWR-8P-RC power meter in this build", verify: true}
      switch_to_antenna: {value: 0.5, unit: dB, source: "estimate", note: "assumed a longer run to the antenna (~0.5 dB); to be measured", verify: true}
      switch_to_lna: {value: 0.2, unit: dB, source: "estimate", note: "T/R switch RX port to the LNA; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      lna_to_atten: {value: 0.2, unit: dB, source: "estimate", note: "LNA to the RX attenuator; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      atten_to_g40: {value: 0.2, unit: dB, source: "estimate", note: "RX attenuator to the G40 RX port; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
    fixed_pad_db: {value: 0, unit: dB, source: "Payload wiring 1189 v2 02Nov26.pdf", note: "no pad between the G40 TX and the HPA input in the top drawing", verify: true}
  P2:
    label: "Payload 2 (1189 HPA, 20 dB TX pad, PASR0200500600B switch, RX attenuator before the LNA, ZB3PD RX splitter)"
    source: "as built on the bench 2026-11-03: TX on TRx2B through a 20 dB pad, attenuator directly after the switch, three RX jacks off the ZB3PD"
    g40_ports: {tx: [TRx2B], rx: [TRx1A, TRx1B, TRx2A]}
    switch_ports: {antenna: J0, rx: J1, tx: J2}
    g40_tx: g40_tx_bench
    g40_rx: g40_rx
    rx_splitter: splitter_zb3pd_63
    hpa: hpa_1189_bench
    switch: switch_pasr0200500600b
    antenna: antenna_omnilog_pro_nh
    lna: lna_palna200101000a
    rx_atten: rcdat_6g_120h
    # RX attenuator in front of the LNA, so its setting protects the LNA in TX.  The
    # cables_db keys keep their names: switch_to_lna is the switch J1 to attenuator run,
    # lna_to_atten the attenuator to LNA run, atten_to_g40 the LNA to G40 run.
    rx_order: atten_first
    # band = overlap of the components' freq_range_mhz unless band_mhz is set here
    cables_db:
      g40_to_hpa: {value: 0.2, unit: dB, source: "estimate", note: "G40 TRx2B to the pad and on to the HPA input; assumed one 12-in Mini-Circuits Hand-Flex .141 assembly (141-12SM+, 0.19 dB at 2 GHz typ); to be measured", verify: true}
      hpa_to_switch: {value: 0.2, unit: dB, source: "estimate", note: "HPA output to the T/R switch J2; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      switch_to_antenna: {value: 0.5, unit: dB, source: "estimate", note: "switch J0 to the antenna; assumed a longer run (~0.5 dB); to be measured", verify: true}
      switch_to_lna: {value: 0.2, unit: dB, source: "estimate", note: "T/R switch J1 to the RX attenuator; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      lna_to_atten: {value: 0.2, unit: dB, source: "estimate", note: "RX attenuator to the LNA; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      atten_to_g40: {value: 0.2, unit: dB, source: "estimate", note: "LNA to the RX splitter and on to one G40 RX jack; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
    fixed_pad_db: {value: 20, unit: dB, source: "as built on the bench 2026-11-03", note: "20 dB pad between G40 TRx2B and the HPA input; nominal value, loss not measured, power rating not on file (it sees the G40 output, about +20 dBm at most)", verify: true}
  P2a:
    label: "Payload 2a (02Nov26 parts: PASR0200500600A switch, no TX pad, RX attenuator before the LNA)"
    source: "Payload wiring 1189 v2 02Nov26.pdf (the 02Nov26 drawing), with one G40 TX port and the ZB3PD on the RX side (2026-11-02)"
    g40_tx: g40_tx
    g40_rx: g40_rx
    rx_splitter: splitter_zb3pd_63
    hpa: hpa_1189
    switch: switch_pasr0200500600a
    antenna: antenna_omnilog_pro_nh
    lna: lna_palna200101000a
    rx_atten: rcdat_6g_120h
    # RX attenuator in front of the LNA, so its setting protects the LNA in TX.  The
    # cables_db keys keep their names: switch_to_lna is the switch to attenuator run,
    # lna_to_atten the attenuator to LNA run, atten_to_g40 the LNA to G40 run.
    rx_order: atten_first
    # band = overlap of the components' freq_range_mhz unless band_mhz is set here
    cables_db:
      g40_to_hpa: {value: 0.2, unit: dB, source: "estimate", note: "one G40 TX port straight to the HPA input; assumed one 12-in Mini-Circuits Hand-Flex .141 assembly (141-12SM+, 0.19 dB at 2 GHz typ); to be measured", verify: true}
      hpa_to_switch: {value: 0.2, unit: dB, source: "estimate", note: "HPA output to the T/R switch; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      switch_to_antenna: {value: 0.5, unit: dB, source: "estimate", note: "assumed a longer run to the antenna (~0.5 dB); to be measured", verify: true}
      switch_to_lna: {value: 0.2, unit: dB, source: "estimate", note: "T/R switch RX port to the RX attenuator; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      lna_to_atten: {value: 0.2, unit: dB, source: "estimate", note: "RX attenuator to the LNA; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
      atten_to_g40: {value: 0.2, unit: dB, source: "estimate", note: "LNA (and the RX splitter) to the G40 RX port; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
    fixed_pad_db: {value: 0, unit: dB, source: "Payload wiring 1189 v2 02Nov26.pdf", note: "no pad between the G40 TX and the HPA input", verify: true}
  P2b:
    label: "Payload 2b (1189 HPA, ZB3PD TX combiner on three G40 TX ports, one RX port TRx2B)"
    source: "bench setup 2026-11-02: 02Nov26 parts with the ZB3PD on the TX side; TRx1A, TRx2A, TRx1B transmit, TRx2B receives"
    g40_ports: {tx: [TRx1A, TRx2A, TRx1B], rx: [TRx2B]}
    g40_tx: g40_tx
    g40_rx: g40_rx
    tx_combiner: splitter_zb3pd_63
    hpa: hpa_1189
    switch: switch_pasr0200500600a
    antenna: antenna_omnilog_pro_nh
    lna: lna_palna200101000a
    rx_atten: rcdat_6g_120h
    # band = overlap of the components' freq_range_mhz unless band_mhz is set here
    cables_db:
      g40_to_hpa: {value: 0.4, unit: dB, source: "estimate", note: "one G40 TX port to the combiner input plus the combiner output to the HPA input; assumed two 12-in Mini-Circuits Hand-Flex .141 assemblies (141-12SM+, 0.19 dB at 2 GHz typ each); the combiner loss itself is tx_combiner; to be measured", verify: true}
      hpa_to_switch: {value: 0.2, unit: dB, source: "estimate", note: "HPA output to the T/R switch; assumed one 12-in Hand-Flex .141 assembly; to be measured", verify: true}
