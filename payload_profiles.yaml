# payload_profiles.yaml: RF chain of each payload build.  Master copy of every number used by:
#   * payload_budget.py            (shared math)
#   * the /payload GUI page        (live EIRP / warnings)
#   * dpmg_service payload guard   (minimum safe RX attenuation before the HPA keys)
#   * tools/gen_payload_workbook.py (writes docs/Payload_EIRP_Link_Budget.xlsx)
# Edit here, then regenerate the workbook and copy the file to the radio (/app_svc)
# and the GUI host; the guard reads it at service start and on frontend_reload.
#
# Builds: P1 (1208 HPA), P2 (1189) and P3 (1211), numbered as in the payload wiring
# drawings (Payload wiring 1189 v2 02Nov26.pdf), except that P2 follows the build on
# the bench as rewired 2026-11-03, not the drawing.  The 1208 and 1211 control
# polarities are not on file (see frontend_setup.py presets).
#
# P2 as built 2026-11-03 has no directional coupler and no power meter:
#   TX:  G40 TRx2B, 20 dB pad, HPA 1189, switch J2, switch J0, antenna
#   RX:  antenna, switch J0, switch J1, RX attenuator, LNA, ZB3PD splitter, G40 TRx1A / TRx1B / TRx2A
# The switch is mounted upside down, so the HPA is on the engraved J2 and the G40 runs
# rf_frontend tr_switch tx_level: 0.  The attenuator directly after the switch is
# rx_order: atten_first, so the setting protects the LNA as well and no G40 TX
# attenuation floor is needed.  P2 reads the bench values of its G40 and HPA
# (g40_tx_bench, hpa_1189_bench; leaves with measured: true), since the datasheet +5 dBm
# G40 figure would put the HPA about 15 dB under its real level behind the pad.
#
# P2a keeps the 02Nov26 parts (PASR0200500600A switch, no pad, datasheet G40 and HPA)
# with the attenuator before the LNA.
# P2b is the bench setup of 2026-11-02: the ZB3PD on the TX side, three G40 TX ports
# (TRx1A, TRx2A, TRx1B) combined into the HPA, one RX port (TRx2B) straight from the RX
# attenuator, with the LNA before the attenuator.
#
# P1 (top drawing) has a ZGDC30-372HP+ coupler after the HPA feeding a PWR-8P-RC meter,
# counted in its hpa_to_switch loss.  The chain for P1, P2b and P3 is:
#   TX:  G40 TX then cable then [TX combiner] then [fixed pad] then HPA then cable then T/R switch then cable then antenna
#   RX:  antenna then T/R switch then cable then LNA then cable then RX attenuator then cable then G40 RX
# There the RX attenuator sits between the LNA and the G40, so it protects the G40 only.
# In the TX state the LNA relies on the switch isolation, and where that is not enough
# against the HPA at Psat (P2b) on the G40 TX attenuation as well: the payload guard
# holds it at or above payload_budget.min_lna_safe_tx_atten.
#
# The g40_ports entry under a profile records which jacks are cabled and switch_ports
# which switch port faces what; the diagram shows them, the math does not read them.
# The coupler and power meter stay in the components section below: they are bench
# characterization equipment (antenna removed, coupler plus power meter inline for a
# per-frequency output-power reading, then taken back out for a loopback), listed under
# bench_fixture and referenced by no payload profile.
#
# The earlier payload block diagram (cited below as the source of a couple of pad
# values) still shows the coupler and the power meter in the payload.  This YAML
# is the current chain.
#
# Leaf format:  {value: x, unit:, source:, note:, verify: bool}
#               {points: [[freq_mhz, value], ...], unit:, source:, note:, verify: bool}
# Tables are interpolated linearly in frequency and clamped at the ends.
# verify: true = estimate, read off a datasheet curve, distributor-sourced, chip-level
# rather than card-level, or not published.  measured: true = a bench reading rather than
# a datasheet value (the workbook labels it MEASURED).  Nothing here is invented: a value
# that was not found is null and the math refuses to use it.
# Values come from the vendor datasheets (URL per value).  Losses are positive dB.
schema_version: 1

protection:
  margin_db: {value: 10, unit: dB, source: "DPMG design choice", note: "G40 RX input kept this far below its max safe input in the TX state (covers RCDAT accuracy, switch isolation spread, antenna reflection, cable estimates)", verify: false}
  min_rx_atten_db: null       # optional explicit floor (dB); null = computed value only

workbook_defaults: {profile: P2, freq_mhz: 2200, tx_atten_db: 10, backoff_db: 3}

# Radio that drives the HPA.  Every profile's g40_tx part is the default (the G40,
# TX attenuation 0 to 41.75 dB).  Another radio swaps only that part: control
# gain means output = the part's max_output_dbm - (gain_max - gain).  The /payload
# page picks the entry from the selected radio (family epiq = g40, uhd + kind
# b200 = b200).  The service-side guard always uses the profile's g40_tx part.
radios:
  g40: {tx: g40_tx, control: atten, min_db: 0, max_db: 41.75, step_db: 0.25, label: "G40 TX atten"}
  b200: {tx: b200_tx, control: gain, min_db: 0, max_db: 89.75, step_db: 0.25, label: "B200 TX gain"}

components:
  g40_tx:
    model: "Epiq Matchstiq G40 (Sidekiq NV100, ADRV9004) TX port"
    datasheet: docs/datasheets/Epiq_Matchstiq_G20_G40.pdf
    freq_range_mhz: {value: [30, 6000], unit: MHz, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", verify: false}
    max_output_dbm: {value: 5, unit: dBm, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "'Typical Output Power +5 dBm' at 0 dB TX attenuation; single number, no frequency table published (ADRV9002 chip: 7.2-7.8 dBm full-scale CW). Measure per frequency on the bench.", verify: true}
    tx_atten_max_db: {value: 41.75, unit: dB, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "0 to 41.75 dB in 0.25 dB steps = libsidekiq skiq_write_tx_attenuation 0..167 qdB (the NV100 sheet says 0-48 dB, inconsistent)", verify: false}
  g40_tx_bench:
    # The G40 on the Payload 2 bench.  Same port as g40_tx with the output measured.
    model: "Epiq Matchstiq G40 TX port, bench unit, output measured 2026-11-02"
    datasheet: docs/datasheets/Epiq_Matchstiq_G20_G40.pdf
    freq_range_mhz: {value: [30, 6000], unit: MHz, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", verify: false}
    max_output_dbm: {value: 20, unit: dBm, source: "bench measurement 2026-11-02 (HPA bench power sweep, profile P2b)", note: "Measured, not the datasheet +5 dBm: +13.4 to +14.3 dBm at the jack, 0 dB TX attenuation, 0.5 tone, plus 6 dB to full scale. Read through cables and a coupler on TRx1A, TRx1B and TRx2A at 915 and 2200 MHz; TRx2B itself not read. A direct reading at TRx2B would confirm it.", measured: true, verify: true}
    tx_atten_max_db: {value: 41.75, unit: dB, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "0 to 41.75 dB in 0.25 dB steps = libsidekiq skiq_write_tx_attenuation 0..167 qdB", verify: false}
  b200_tx:
    # TX of an Ettus B200mini driving the HPA instead of the G40 (radios: b200
    # below).  Only the output at full gain is on file; the rest of the chain is
    # the same profile.
    model: "Ettus USRP B200mini (AD9364) TX port"
    freq_range_mhz: {value: [70, 6000], unit: MHz, source: "https://www.ettus.com/wp-content/uploads/2019/01/USRP_B200mini_Data_Sheet.pdf", verify: false}
    max_output_dbm: {value: 10, unit: dBm, source: "https://www.ettus.com/wp-content/uploads/2019/01/USRP_B200mini_Data_Sheet.pdf", note: "datasheet 'Power Output >10 dBm' at maximum TX gain, single number, no frequency table; it falls off toward 6 GHz. Datasheet value, MEASURE per frequency on the bench.", verify: true}
    tx_gain_max_db: {value: 89.75, unit: dB, source: "UHD get_tx_gain_range on the B200mini (0 to 89.75 dB, 0.25 dB steps; sdr_core UhdBackend.TX_GAIN_MAX_DB)", note: "output = max_output_dbm - (89.75 - gain)", verify: false}
    bench_max_gain_db: {value: 45, unit: dB, source: "DPMG bench rule", note: "B200 TX gain 45 dB or less into the 20 dB pad on the bench loopback; shown as a warning in the planning view, not a hard stop", verify: false}
  g40_rx:
    model: "Epiq Matchstiq G40 (Sidekiq NV100) RX port"
    datasheet: docs/datasheets/Epiq_Matchstiq_G20_G40.pdf
    freq_range_mhz: {value: [30, 6000], unit: MHz, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", verify: false}
    max_safe_input_dbm: {value: 20, unit: dBm, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "'Max RF Input Power Level (without damage) +20 dBm', card level, CW/peak not stated. ADI UG-1828 reportedly gives 18 dBm peak for the bare ADRV900x (unconfirmed); the 10 dB protection margin covers it.", verify: true}
    max_operating_input_dbm: {value: -25, unit: dBm, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "RF full-scale input at MAX RX gain, TRx1x ports (TRx2x: -18 dBm); ~34 dB higher at minimum gain (derived). Used only as a 'strong signal' hint in the link budget.", verify: true}
    noise_figure_db: {value: 5, unit: dB, source: "https://resources.epiqsolutions.com/hubfs/Matchstiq%20G20%20%26%20G40%20datasheet.pdf", note: "'Noise Figure (Typ.) <5 dB', single number at max gain, no frequency table", verify: true}
  hpa_1189:
    model: "Empower RF 1189 (500-2500 MHz, 100 W min / 125 W typ)"
    datasheet: docs/datasheets/EmpowerRF_1189.pdf
    freq_range_mhz: {value: [500, 2500], unit: MHz, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", verify: false}
    gain_db: {points: [[500, 55.0], [600, 56.8], [700, 53.5], [1000, 56.8], [1250, 54.1], [1600, 57.3], [1800, 54.7], [2000, 54.2], [2200, 56.4], [2400, 56.2], [2500, 54.0]], unit: dB, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "small-signal gain read from datasheet Plot 1 (PIN -20 dBm), approx +/-0.3 dB; guaranteed only Gp >= 50 dB at P1dB", verify: true}
    psat_dbm: {value: 51.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "Psat 125 W typ (100 W min = 50.0 dBm); typ used (worst case for protection)", verify: false}
    p1db_dbm: {value: 47.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "50 W typ at 1 dB compression", verify: false}
    max_input_dbm: {value: 10, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "input RF drive without damage", verify: false}
    drive_for_psat_dbm: {value: 0, unit: dBm, note: "typ (max +3 dBm)", source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", verify: false}
    off_gain_db: null   # feed-through with the HPA disabled: not published
    control: "DB9 pin 5 Shutdown: TTL HIGH = DISABLED, internally pulled LOW -> amplifier ON when the pin floats. rf_frontend pa_enable.active_high: false. No fault output (analog current/temperature monitors only)."
  hpa_1189_bench:
    # The 1189 on the Payload 2 bench: small-signal gain and Psat measured, the rest
    # from the datasheet (hpa_1189 keeps the datasheet gain table).
    model: "Empower RF 1189 bench unit, gain and Psat measured 2026-11-02"
    datasheet: docs/datasheets/EmpowerRF_1189.pdf
    freq_range_mhz: {value: [500, 2500], unit: MHz, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", verify: false}
    gain_db: {points: [[915, 58.9], [2200, 55.3]], unit: dB, source: "bench measurement 2026-11-02 (HPA bench power sweep, profile P2b)", note: "Measured small-signal gain at the two frequencies swept (with the HPA minus without it, cables cancel). Straight line between them and clamped outside, so the datasheet ripple of a few dB is not in it", measured: true, verify: true}
    psat_dbm: {value: 51.6, unit: dBm, source: "bench measurement 2026-11-02 (HPA bench power sweep, profile P2b)", note: "Measured highest output (cable-corrected, about 1 dB uncertainty), above the 51.0 dBm datasheet typical, so it is the worst case for RX protection", measured: true, verify: true}
    p1db_dbm: {value: 47.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "50 W typ at 1 dB compression", verify: false}
    max_input_dbm: {value: 10, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", note: "input RF drive without damage", verify: false}
    drive_for_psat_dbm: {value: 0, unit: dBm, note: "typ (max +3 dBm)", source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1189.pdf", verify: false}
    off_gain_db: null   # feed-through with the HPA disabled: not published
    control: "DB9 pin 5 Shutdown: TTL HIGH = DISABLED, internally pulled LOW -> amplifier ON when the pin floats. rf_frontend pa_enable.active_high: false. No fault output (analog current/temperature monitors only)."
  hpa_1208:
    model: "Empower RF 1208 (500-2700 MHz, 90 W min / 100 W typ)"
    datasheet: docs/datasheets/EmpowerRF_1208.pdf
    freq_range_mhz: {value: [500, 2700], unit: MHz, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", verify: false}
    gain_db: {points: [[500, 61.4], [600, 58.6], [700, 59.9], [800, 60.6], [900, 60.7], [1000, 60.6], [1100, 58.7], [1200, 60.7], [1400, 59.9], [1600, 60.5], [1800, 59.9], [2000, 59.6], [2200, 61.5], [2300, 61.8], [2400, 60.1], [2600, 60.1], [2700, 59.5]], unit: dB, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", note: "small-signal gain read from datasheet Plot 1 (PIN -20 dBm), approx +/-0.3 dB; guaranteed Gp 50 min / 56 typ at P1dB", verify: true}
    psat_dbm: {value: 50.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", note: "Psat 100 W typ (90 W min = 49.5 dBm)", verify: false}
    p1db_dbm: {value: 47.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", note: "50 W typ at 1 dB compression", verify: false}
    max_input_dbm: {value: 10, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", note: "input RF drive without damage", verify: false}
    drive_for_psat_dbm: {value: -5, unit: dBm, note: "typ (max 0 dBm)", source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1208.pdf", verify: false}
    off_gain_db: null   # feed-through with the HPA disabled: not published
    control: "DB9 pin 5 Shutdown: TTL HIGH = DISABLED, internally pulled LOW -> ON when floating (same as 1189). No fault output."
  hpa_1211:
    model: "Empower RF 1211 (500-2500 MHz, 100 W min / 125 W typ, 48 V)"
    datasheet: docs/datasheets/EmpowerRF_1211.pdf
    freq_range_mhz: {value: [500, 2500], unit: MHz, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1211.pdf", verify: false}
    gain_db: {value: 64, unit: dB, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1211.pdf", note: "small-signal gain typ (57 min) at the nominal setting of its 15 dB internal attenuator (0.5 dB steps); flatness +/-2 dB; no gain-vs-frequency data published", verify: true}
    psat_dbm: {value: 51.0, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1211.pdf", note: "peak output 125 W typ (100 W min)", verify: false}
    p1db_dbm: null    # not published -> Rapp smoothness falls back to s=2 (verify)
    max_input_dbm: {value: 3, unit: dBm, source: "https://www.empowerrf.com/datasheet/Empower_RF_Amplifier_1211.pdf", note: "input RF drive without damage", verify: false}
    drive_for_psat_dbm: null   # not published (estimate -7 to -14 dBm from gain) -> bench
    off_gain_db: null   # feed-through with the HPA disabled: not published
    control: "DB17W2 pin 6 PA Enable: LOW = DISABLED, internally pulled HIGH to 3.3 V -> ON when floating (OPPOSITE of 1189/1208; a BSS138 level shifter that pulls the 5 V side HIGH also leaves it ON). Pin 7 alarm HIGH = fault; pin 15 reset; RS-485."
  coupler_zgdc30_372hp:
    model: "Mini-Circuits ZGDC30-372HP+ 30 dB directional coupler (bench characterization only, not in the payload)"
    datasheet: docs/datasheets/MiniCircuits_ZGDC30-372HP+.pdf
    freq_range_mhz: {value: [380, 3700], unit: MHz, source: "https://www.minicircuits.com/pdfs/ZGDC30-372HP+.pdf", verify: false}
    mainline_loss_db: {points: [[380, 0.03], [600, 0.04], [1500, 0.08], [2000, 0.1], [2500, 0.12], [2700, 0.13], [3000, 0.15], [3600, 0.17], [3700, 0.19]], unit: dB, source: "https://www.minicircuits.com/pdfs/ZGDC30-372HP+.pdf", note: "typical performance table IN-OUT (max 0.30 dB 600-2700 MHz)", verify: false}
    coupling_db: {points: [[380, 33.4], [600, 31.1], [1500, 30.3], [2000, 30.5], [2500, 30.3], [2700, 30.6], [3000, 31.0], [3600, 31.3], [3700, 31.5]], unit: dB, source: "https://www.minicircuits.com/pdfs/ZGDC30-372HP+.pdf", note: "typical table IN-CPL (spec 30.0 +/- 0.7 dB 600-2700 MHz)", verify: false}
    power_rating_dbm: {points: [[380, 53.98], [2700, 53.98], [2701, 51.76], [3700, 51.76]], unit: dBm, source: "https://www.minicircuits.com/pdfs/ZGDC30-372HP+.pdf", note: "250 W CW 380-2700 MHz, 150 W 2700-3700 MHz at 25 C with output load VSWR <= 2:1; derate to 100 W at 100 C", verify: false}
  power_meter_pwr_8p_rc:
    model: "Mini-Circuits PWR-8P-RC power sensor (bench characterization only, not in the payload)"
    datasheet: docs/datasheets/MiniCircuits_PWR-8P-RC.pdf
    freq_range_mhz: {value: [10, 8000], unit: MHz, source: "https://www.minicircuits.com/pdfs/PWR-8P-RC.pdf", verify: false}
    max_input_dbm: {value: 23, unit: dBm, source: "https://www.minicircuits.com/pdfs/PWR-8P-RC.pdf", note: "maximum continuous safe operating input; absolute max (damage) +26 dBm CW; measurement range -60..+20 dBm", verify: false}
    measure_max_dbm: {value: 20, unit: dBm, source: "https://www.minicircuits.com/pdfs/PWR-8P-RC.pdf", verify: false}
