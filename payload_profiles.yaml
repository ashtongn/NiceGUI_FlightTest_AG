risks:
  - "PASR0200500600B (P2 switch) has no CW rating on its datasheet, only 50 dBm pulsed (20 us, 10 % duty), and the 1189 reaches about 51.6 dBm. Get a CW rating from dBWave before CW keying at high power. Heat sink and air flow are mandatory."
  - "P2 EIRP uses the G40 output measured on the bench (about +20 dBm full scale) because the datasheet +5 dBm reads about 15 dB low; behind the 20 dB pad the HPA still saturates near 0 dB TX attenuation."
  - "HPA PSAT typ 125 W (1189, 1211) exceeds the PE71S2041 switch CW rating 100 W. 1208 typ 100 W is at the limit. Back off drive or cap output at <=100 W."
  - "Switch hot-switching limit is 30 W CW: disable the HPA (1189/1208 pin 5 HIGH; 1211 pin 6 LOW) before changing T/R; HPA disable time is 1-5 us, switch time 6-10 us."
  - "HPA defaults are ENABLED when control pins float (1189/1208 pull-low on an active-high shutdown; 1211 pull-high on an active-low enable). Opposite polarities between models."
  - "Switch spec starts at 800 MHz and N-H antenna at 700 MHz; HPAs start at 500 MHz."
  - "Antenna: plain OmniLOG PRO N is rated 1 W; only the N-H (H series) is rated 100 W."
  - "Bench only: the power sensor on the coupler coupled port sees ~+20.7 dBm at 125 W (limit +23 dBm safe, +26 dBm damage): add a pad. The coupler and meter are characterization equipment, removed before flight."
  - "Bench only: the coupler input rating is 250 W CW (600-2700 MHz) at 25 C with an output load VSWR <= 2.0:1. During characterization a load mismatch above 2:1 is outside that rating; reflected power goes back into the HPA (load-VSWR tolerance 3:1 continuous)."
  - "ZKL-33ULN-S+ (P1 LNA) survives only -10 dBm at 400 MHz rising to 0 dBm at ~1.5 GHz and +10 dBm at 3 GHz; very low at UHF. In P1 the RX attenuator sits after the LNA, so in TX the LNA is protected only by the switch isolation (no limiter). The minimum safe RX attenuation protects the G40, not the LNA."
  - "1211 max input is +3 dBm: the G40 at 0 dB TX attenuation (+5 dBm typ) with a full-scale CW waveform overdrives it; keep >= 2-3 dB TX attenuation or add a pad."
  - "G40 TX output vs frequency and RX noise figure vs frequency are not published (single typical numbers used, VERIFY); measure both on the bench."
  - "Cable losses are estimates (one 12-in .141 assembly per segment); measure the harness."
